name: Build AltFactor Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package (for example, 2.0.0)
        required: true
        default: 2.0.0
        type: string

permissions:
  contents: read

jobs:
  build-installer:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Validate version input
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use numeric MAJOR.MINOR.PATCH format."
          }
          "BUILD_VERSION=$env:INPUT_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        shell: pwsh
        run: dotnet restore .\AviUtl2FAT.sln

      - name: Build .NET solution
        shell: pwsh
        run: dotnet build .\AviUtl2FAT.sln --configuration Release --no-restore

      - name: Run Core tests
        shell: pwsh
        run: dotnet test .\tests\AviUtl2FAT.Core.Tests\AviUtl2FAT.Core.Tests.csproj --configuration Release --no-restore --no-build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/python/requirements-dev.txt

      - name: Install Python test and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r .\runtime\python\requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s .\runtime\python\tests -p "test_*.py" -v

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check Rust plugin
        shell: pwsh
        run: cargo check --manifest-path .\plugin\Cargo.toml --locked

      - name: Stage verified FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveUrl = 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.zip'
          $archiveHash = '6F58CE889F59C311410F7D2B18895B33C03456463486F3B1EBC93D97A0F54541'
          $ffmpegHash = '228D7A8556258DE907FDB55F36850078EBC7680B84EC30D84EA02E99BEC1D1EB'
          $ffprobeHash = '0FDE260F5ABD35C9CAFD96F594CC76365A780C1B73A90E35B6A3409EA1DB1BF0'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'altfactor-ffmpeg-8.1.1'
          $archivePath = Join-Path $downloadRoot 'ffmpeg-8.1.1-essentials_build.zip'
          $extractPath = Join-Path $downloadRoot 'expanded'

          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          $actualArchiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualArchiveHash -ne $archiveHash) {
            throw "FFmpeg archive hash mismatch. Expected $archiveHash, got $actualArchiveHash."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $ffmpeg = Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw 'The verified FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe.'
          }
          if ((Get-FileHash -LiteralPath $ffmpeg.FullName -Algorithm SHA256).Hash -ne $ffmpegHash) {
            throw 'ffmpeg.exe hash mismatch.'
          }
          if ((Get-FileHash -LiteralPath $ffprobe.FullName -Algorithm SHA256).Hash -ne $ffprobeHash) {
            throw 'ffprobe.exe hash mismatch.'
          }

          $runtimePath = Join-Path $env:GITHUB_WORKSPACE 'runtime\ffmpeg'
          New-Item -ItemType Directory -Force -Path $runtimePath | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $runtimePath 'ffmpeg.exe') -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $runtimePath 'ffprobe.exe') -Force
          Write-Host 'Staged the hash-verified Gyan.dev FFmpeg 8.1.1 essentials binaries without executing them.'

      - name: Install and verify Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $knownPaths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $knownPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install Inno Setup 6 (exit code $LASTEXITCODE)."
            }
            $iscc = $knownPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'ISCC.exe was not found after installing Inno Setup 6.'
          }
          Write-Host "ISCC path: $iscc"
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $isccHelp = & $iscc /? 2>&1
            $isccExitCode = $LASTEXITCODE
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }
          $isccHelp | Write-Host
          if ($isccExitCode -notin @(0, 1) -or ($isccHelp -join "`n") -notmatch 'Inno Setup 6') {
            throw "ISCC.exe version check failed (exit code $isccExitCode)."
          }

      - name: Build installer with the project packaging script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\package-v1.0.ps1 `
            -Version $env:BUILD_VERSION `
            -BuildInstaller `
            -SkipPortableArchive `
            -Clean

      - name: Verify installer and generate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerName = "AviUtl2-AltFactor-Setup-$env:BUILD_VERSION-x64.exe"
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "dist\$installerName"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Expected installer was not generated: $installerPath"
          }

          $file = Get-Item -LiteralPath $installerPath
          if ($file.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($file.Length) bytes."
          }
          $stream = [System.IO.File]::OpenRead($installerPath)
          try {
            $firstByte = $stream.ReadByte()
            $secondByte = $stream.ReadByte()
            if ($firstByte -ne 0x4D -or $secondByte -ne 0x5A) {
              throw 'Installer is not a Windows PE file (missing MZ header).'
            }
          }
          finally {
            $stream.Dispose()
          }

          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installerPath)
          if ($versionInfo.ProductName -ne 'AviUtl2 AltFactor') {
            throw "Unexpected Product Name: $($versionInfo.ProductName)"
          }
          $acceptedVersions = @($env:BUILD_VERSION, "$env:BUILD_VERSION.0")
          if ($versionInfo.FileVersion -notin $acceptedVersions) {
            throw "Unexpected File Version: $($versionInfo.FileVersion)"
          }
          if ($versionInfo.ProductVersion -notin $acceptedVersions) {
            throw "Unexpected Product Version: $($versionInfo.ProductVersion)"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installerPath
          if ($signature.Status -eq 'Valid') {
            $signatureState = "Valid ($($signature.SignerCertificate.Subject))"
          }
          elseif ($signature.Status -eq 'NotSigned') {
            $signatureState = 'Unsigned (expected for this verification artifact)'
          }
          else {
            throw "Unexpected Authenticode state: $($signature.Status) - $($signature.StatusMessage)"
          }

          $hash = Get-FileHash -LiteralPath $installerPath -Algorithm SHA256
          $hashPath = "$installerPath.sha256"
          "$($hash.Hash)  $installerName" | Set-Content -LiteralPath $hashPath -Encoding ascii

          $relativeInstaller = "dist\$installerName"
          $relativeHash = "dist\$installerName.sha256"
          "INSTALLER_PATH=$relativeInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256_PATH=$relativeHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @"
          ## AltFactor installer verification

          - File: ``$installerName``
          - Size: $([Math]::Round($file.Length / 1MB, 2)) MiB
          - Product: ``$($versionInfo.ProductName)``
          - File version: ``$($versionInfo.FileVersion)``
          - Product version: ``$($versionInfo.ProductVersion)``
          - SHA-256: ``$($hash.Hash)``
          - Authenticode: $signatureState

          This artifact is for manual V1.1.7 to V2.0 upgrade verification. A successful CI build does not publish or declare V2.0 Stable.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload verified installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AviUtl2-AltFactor-${{ inputs.version }}-Installer
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_SHA256_PATH }}
          if-no-files-found: error
          retention-days: 14
